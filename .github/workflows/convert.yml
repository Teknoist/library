name: Update files.json when links.txt changes

on:
  push:
    paths:
      - "links.txt"  # sadece links.txt değişince çalışır
  workflow_dispatch: # elle tetiklemek istersen

permissions:
  contents: write

concurrency:
  group: convert-files-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Run convert script
      run: python convert.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add files.json
        git commit -m "Auto-update files.json" || echo "No changes to commit"
        git push
